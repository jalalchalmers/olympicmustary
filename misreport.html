          <div style="font-size:12px;color:var(--ink3);margin-top:3px">দৈনিক চালান-ভিত্তিক পণ্য পরিমাণ ম্যাট্রিক্স — ফ্রি সহ ডেলিভারিকৃত কার্টন</div>

        <div class="field" style="margin:0"><label style="font-size:11px">পর্যন্ত</label><input type="date" id="m-to"/></div>
        <div class="field" style="margin:0"><label style="font-size:11px">অথবা মাস</label><input type="month" id="m-month"/></div>
        <div class="field" style="margin:0;min-width:170px"><label style="font-size:11px">গ্রাহক</label><select id="m-party"><option value="">সব গ্রাহক</option></select></div>
        <div class="field" style="margin:0;min-width:170px"><label style="font-size:11px">সরবরাহকারী</label><select id="m-sup"><option value="">সব সরবরাহকারী</option></select></div>
        <div class="field" style="margin:0;min-width:130px"><label style="font-size:11px">এলাকা</label><select id="m-area"><option value="">সব এলাকা</option></select></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script>
if(!Auth.require('misreport.html'))throw new Error('auth');
buildNav('misreport');

let rpt=null;   // last computed report

const P_ALL=()=>JSON.parse(localStorage.getItem('bf_parties')||'[]');
const PR_ALL=()=>JSON.parse(localStorage.getItem('bf_products')||'[]');

/* Fixed Olympic MIS-code sequence, EXPORT ONLY. Verified against the depot's
   own two lists (105 unique codes) on 2026-07-30. Never used to force extra
   columns — only to ORDER whichever columns already have real activity. */
const FIXED_MIS_CODES=['OS','OF','TPC','TOC','TMC','TTCC','TPT','TOT','TMT','TTCT','TTPF','TOF','TMF','LCT','LCC','LCF','MPS','EPT','OPT','GPLE','GPLO','GPLM','KMS','KMF','CBS','CBF','CAB','FBS','HB','MLF','MLC','MPAF','MPAC','NTC','BCS','SFS','SFF','SF','NBT','QMM','QMS','QMF','SLT','SLF','PZF','BMC','MDCS','MDC','DT','IMS','IMF','ICF','IME','ICE','IMT','ICT','FMCN','FCCN','RCF','RHF','RCE','RHE','FBCB','FBJM','NMX','TTM','TTK','TTC','JMC','PCJ','JHM','JPA','JMO','JMM','JDC','MCP','PCPF','CPA','MMOP','MMMP','CHPT','CHPC','CSPS','CHPF','CHPL','TUPT','TUPC','TUPS','TUPF','TUPL','CUPT','CUPC','CUPS','CUPF','CUPL','COPT','COPC','COPS','COPF','COPL','MUOT','MUOS','MUOM','MUOF','MUOL'];
const MIS_RANK={};FIXED_MIS_CODES.forEach((c,i)=>{MIS_RANK[c]=i;});
const codeSort=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});

/* Current PURCHASE-side effective price per carton (offer-aware) — used as
   the Rate row's fallback for a fixed column with zero sales this period. */
function purchEffOf(p){
  if(!p) return 0;
  const price=parseFloat(p.price)||0;
  const has=(p.hasOffer===true||p.hasOffer==='true');
  const os=has?(parseFloat(p.offerSize)||0):0;
  const fq=has?(parseFloat(p.freeQty)||0):0;
  const eff=(os>0&&(os+fq)>0)?(price*os/(os+fq)):price;
  const cs=parseFloat(p.cartonSize)||0;
  return cs>0?Math.round(eff*cs*100)/100:Math.round(eff*100)/100;
}

function rangeOf(){
  const mo=document.getElementById('m-month').value;
  let from=document.getElementById('m-from').value;
  let to=document.getElementById('m-to').value;
  if(mo){ from=mo+'-01';
    const d=new Date(parseInt(mo.slice(0,4)),parseInt(mo.slice(5,7)),0);
    to=mo+'-'+String(d.getDate()).padStart(2,'0');
  }
  return {from,to};
}

/* Matrix rows = sales invoices in range passing the party/area/zone filters.
   Supplier filter counts ONLY that supplier's product lines (row dropped if
   none qualify). Qty = delivered cartons incl. free. Value = actual frozen
   line amounts. Rate row = latest per-carton rate in range (✱ = multiple).
   Columns are ALWAYS activity-only (a product with zero sales this period
   never gets a column) — the only thing that differs by mode is ORDER and
   LABEL:
     screen (forExport falsy) → sorted by the product's OWN code, ascending;
       labeled by that same code. This is the internal working view.
     export (forExport=true)  → sorted by position in Olympic's fixed MIS-code
       sequence (any product without a matching misCode sorts after all
       mapped ones, in its own code order); labeled by misCode, falling back
       to the product's own code when no misCode is set. Adding a new product
       later needs no changes here — screen sorting is always live/ascending,
       and an unmapped new product simply appends after the known sequence
       in the export until it's given a real misCode. */
function computeMis(forExport){
  const {from,to}=rangeOf();
  const fParty=document.getElementById('m-party').value;
  const fSup=document.getElementById('m-sup').value;
  const fArea=document.getElementById('m-area').value;
  const fZone=document.getElementById('m-zone').value;
  const partiesL=P_ALL(), products=PR_ALL();
  const pMeta={};partiesL.forEach(p=>{pMeta[p.id]={name:p.name||'',area:(p.area||'').trim(),zone:(p.zone||'').trim(),code:(p.code||'').trim()};});
  const pInfo={};products.forEach(p=>{pInfo[p.id]={code:String(p.code||p.id),misCode:(p.misCode||'').trim(),name:p.name||'',cs:parseFloat(p.cartonSize)||0,sup:String(p.supplierId||'')};});
  const orders=JSON.parse(localStorage.getItem('bf_orders')||'[]');

  const sales=orders.filter(o=>{
    if(o.orderType!=='sales')return false;
    const k=fmt.dkey(o.date);
    if(from&&k<from)return false;
    if(to&&k>to)return false;
    if(fParty&&String(o.partyId)!==fParty)return false;
    const pm=pMeta[o.partyId]||{};
    if(fArea&&pm.area!==fArea)return false;
    if(fZone&&pm.zone!==fZone)return false;
    return true;
  }).sort((a,b)=>fmt.dkey(a.date)<fmt.dkey(b.date)?-1:1);

  const colSet=new Map(), rows=[], rates={}, prodTot={};
  sales.forEach(o=>{
    let items=[];try{items=JSON.parse(o.items||'[]');}catch(e){return;}
    const pm=pMeta[o.partyId]||{name:o.partyName||'অজানা',area:'',zone:'',code:''};
    const row={date:fmt.dmy(o.date),dkey:fmt.dkey(o.date),challan:o.orderId,partyId:String(o.partyId),party:pm.name,area:pm.area,zone:pm.zone,code:pm.code,qty:{},value:0};
    items.forEach(it=>{
      const inf=pInfo[it.productId];if(!inf)return;
      if(fSup&&inf.sup!==fSup)return;
      const pcs=parseFloat(it.totalPieces)||((parseFloat(it.qtyPieces)||parseFloat(it.qty)||0)+(parseFloat(it.freePieces)||0));
      if(pcs<=0)return;
      const ctn=inf.cs>0?pcs/inf.cs:pcs;
      if(!colSet.has(it.productId))colSet.set(it.productId,inf);
      row.qty[it.productId]=(row.qty[it.productId]||0)+ctn;
      let amt=parseFloat(it.total);if(isNaN(amt))amt=0;
      row.value+=amt;
      if(!prodTot[it.productId])prodTot[it.productId]={ctn:0,amt:0};
      prodTot[it.productId].ctn+=ctn;prodTot[it.productId].amt+=amt;
      const up=parseFloat(it.usedPrice);
      if(!isNaN(up)&&inf.cs>0){
        const perCtn=Math.round(up*inf.cs*100)/100;
        if(!rates[it.productId])rates[it.productId]=new Map();
        rates[it.productId].set(perCtn,fmt.dkey(o.date));
      }
    });
    if(Object.keys(row.qty).length)rows.push(row);
  });

  let cols=[...colSet.entries()].map(([pid,inf])=>{
    const rm=rates[pid]||new Map();
    let latest='',latestKey='',all=[];
    rm.forEach((dk,rate)=>{all.push(rate);if(dk>=latestKey){latestKey=dk;latest=rate;}});
    return {pid,code:inf.code,misCode:inf.misCode,name:inf.name,rate:latest,multi:all.length>1,allRates:all.sort((a,b)=>a-b)};
  });

  if(forExport){
    // Full skeleton: every code in Olympic's fixed sequence, even zero-sales
    // this period. Narrowed to the active supplier's own codes if filtered.
    const byMisCode={};
    products.forEach(p=>{const mc=(p.misCode||'').trim();if(mc)byMisCode[mc]=p;});
    let skeleton=FIXED_MIS_CODES.map(code=>{
      const p=byMisCode[code];
      if(!p)return {pid:null,code:code,misCode:code,name:'',cs:0,sup:''};
      return {pid:p.id,code:String(p.code||p.id),misCode:code,name:p.name||'',cs:parseFloat(p.cartonSize)||0,sup:String(p.supplierId||'')};
    });
    if(fSup)skeleton=skeleton.filter(c=>c.pid&&c.sup===fSup);
    const skeletonPids=new Set(skeleton.filter(c=>c.pid).map(c=>c.pid));
    const byId={};products.forEach(p=>{byId[p.id]=p;});
    // extras: products with real activity this period but no matching misCode
    const extra=[],seenExtra=new Set();
    cols.forEach(c=>{
      if(skeletonPids.has(c.pid)||seenExtra.has(c.pid))return;
      seenExtra.add(c.pid);
      extra.push({pid:c.pid,code:c.code,misCode:'',name:c.name,cs:pInfo[c.pid]?.cs||0,sup:pInfo[c.pid]?.sup||''});
    });
    if(fSup)for(let i=extra.length-1;i>=0;i--)if(extra[i].sup!==fSup)extra.splice(i,1);
    extra.sort((a,b)=>codeSort(a.code,b.code));

    const activityByPid={};cols.forEach(c=>{activityByPid[c.pid]=c;});
    cols=[...skeleton,...extra].map(c=>{
      const act=c.pid?activityByPid[c.pid]:null;
      if(act) return {pid:act.pid,col:c.misCode||c.code,name:act.name,rate:act.rate,multi:act.multi,allRates:act.allRates};
      // zero sales this period (or no product mapped at all) → fallback rate
      const rate=c.pid?purchEffOf(byId[c.pid]):0;
      return {pid:c.pid,col:c.misCode||c.code,name:c.name,rate,multi:false,allRates:rate?[rate]:[]};
    });
  }else{
    cols.sort((a,b)=>codeSort(a.code,b.code));
    cols=cols.map(c=>({...c,col:c.code}));
  }

  rpt={from,to,cols,rows,prodTot};
  return rpt;
}

function fnum(n){return Math.abs(n-Math.round(n))<0.005?String(Math.round(n)):n.toFixed(2);}

function renderMis(){
  const r=computeMis();   // screen mode: own code, ascending
  const thead=document.querySelector('#mis-table thead');
  const tbody=document.querySelector('#mis-table tbody');
  const tfoot=document.querySelector('#mis-table tfoot');
  if(!r.rows.length){
    thead.innerHTML='';tfoot.innerHTML='';
    tbody.innerHTML='<tr><td style="padding:24px;text-align:center;color:var(--ink3)">এই সীমা/ফিল্টারে কোনো বিক্রয় নেই</td></tr>';
    document.getElementById('mis-legend').innerHTML='';return;
  }
  thead.innerHTML=
    '<tr class="rate"><td colspan="4" class="r">Rate (কার্টন):</td>'+r.cols.map(c=>`<td class="r" title="${c.name}">${fnum(c.rate)}${c.multi?'✱':''}</td>`).join('')+'<td></td></tr>'
    +'<tr><th>SL</th><th>Date</th><th>Challan No</th><th>গ্রাহক</th>'+r.cols.map(c=>`<th class="r" title="${c.name}">${c.col}</th>`).join('')+'<th class="r">Total Value</th></tr>';
  tbody.innerHTML=r.rows.map((row,i)=>
    `<tr><td>${i+1}</td><td>${row.date}</td><td>${row.challan}</td><td>${row.party}</td>`
    +r.cols.map(c=>`<td class="r">${row.qty[c.pid]?fnum(row.qty[c.pid]):''}</td>`).join('')
    +`<td class="r">${fmt.currency(row.value)}</td></tr>`).join('');
  const totQ={};let totV=0;
  r.rows.forEach(row=>{r.cols.forEach(c=>{totQ[c.pid]=(totQ[c.pid]||0)+(row.qty[c.pid]||0);});totV+=row.value;});
  tfoot.innerHTML='<tr><td colspan="4">মোট</td>'+r.cols.map(c=>`<td class="r">${fnum(totQ[c.pid]||0)}</td>`).join('')+`<td class="r">${fmt.currency(totV)}</td></tr>`;
  const multi=r.cols.filter(c=>c.multi);
  document.getElementById('mis-legend').innerHTML=
    `${r.rows.length}টি চালান · ${new Set(r.rows.map(x=>x.partyId)).size}টি গ্রাহক · ${r.cols.length}টি পণ্য কলাম · পরিমাণ = ডেলিভারিকৃত কার্টন (ফ্রি সহ) · Total Value = ইনভয়েসের প্রকৃত মূল্য`
    +(multi.length?`<br>✱ একাধিক দর: ${multi.map(c=>`${c.col} (${c.allRates.map(fnum).join(' / ')})`).join(', ')} — Rate ঘরে সর্বশেষ দর`:'');
}

/* Workbook: Sheet 1 = per-customer summary; then one sheet per customer with
   that customer's own challan matrix (own active columns + rates). */
function sheetNameSafe(name,used){
  let n=String(name||'Customer').replace(/[\[\]\\\/:*?]/g,'').slice(0,28)||'Customer';
  let base=n,i=2;
  while(used.has(n)){n=base.slice(0,25)+'_'+i;i++;}
  used.add(n);return n;
}
function downloadXlsx(){
  computeMis(true);   // fresh EXPORT-mode report (misCode order + labels) — always current
  if(!rpt||!rpt.rows.length){toast('এই সীমা/ফিল্টারে কোনো বিক্রয় নেই','error');return;}
  const depoName=localStorage.getItem('bf_biz_name')||'';
  const depoCode=localStorage.getItem('bf_depo_code')||'';
  const period=(rpt.from||'')+' — '+(rpt.to||'');
  const wb=XLSX.utils.book_new();
  const used=new Set();

  // group rows per customer (insertion order preserved)
  const groups=new Map();
  rpt.rows.forEach(row=>{
    if(!groups.has(row.partyId))groups.set(row.partyId,{partyId:row.partyId,party:row.party,area:row.area,zone:row.zone,code:row.code||'',rows:[]});
    groups.get(row.partyId).rows.push(row);
  });

  // ── Sheet 1: Summary — zone-grouped (zones alphabetical, 'জোন নেই' last;
  //    customers inside a zone by delivery amount desc; zone subtotal rows) ──
  const byZone=new Map();
  groups.forEach(g=>{
    const z=g.zone||'জোন নেই';
    if(!byZone.has(z))byZone.set(z,[]);
    byZone.get(z).push(g);
  });
  const zoneNames=[...byZone.keys()].sort((a,b)=>{
    if(a==='জোন নেই')return 1;if(b==='জোন নেই')return -1;
    return a.localeCompare(b,'bn');
  });
  const sm=[];
  sm.push(['Depo Name: '+depoName,'','','','','','Depo Code: '+depoCode]);
  sm.push(['Customer wise MIS Summary','','','','','','Period: '+period]);
  sm.push([]);
  // Olympic mapping: their Area = our zone; their Point = our area.
  // Zone & Region left BLANK for manual fill in Excel.
  sm.push(['SL','Zone','Region','Area','SAP ID','Distributor Name','Point','Challans','Delivery Amount']);
  let gv=0,gc=0,si=1;
  zoneNames.forEach(z=>{
    const list=byZone.get(z).map(g=>({g,v:g.rows.reduce((s,r)=>s+r.value,0)}))
      .sort((a,b)=>b.v-a.v);
    let zv=0,zc=0;
    list.forEach(({g,v})=>{
      sm.push([si++,'','',z==='জোন নেই'?'':z,g.code||'',g.party,g.area||'',g.rows.length,Math.round(v*100)/100]);
      zv+=v;zc+=g.rows.length;gv+=v;gc+=g.rows.length;
    });
    sm.push(['','','','','','Total — '+z,'',zc,Math.round(zv*100)/100]);
  });
  sm.push(['','','','','','GRAND TOTAL','',gc,Math.round(gv*100)/100]);
  const ws0=XLSX.utils.aoa_to_sheet(sm);
  ws0['!cols']=[{wch:4},{wch:10},{wch:10},{wch:14},{wch:11},{wch:26},{wch:14},{wch:9},{wch:15}];
  XLSX.utils.book_append_sheet(wb,ws0,'Summary');

  // ── MIS Report sheet: the full matrix, columns in Olympic's misCode order ──
  const mr=[];
  mr.push(['Depo Name: '+depoName,'','','Depo Code: '+depoCode]);
  mr.push(['MIS Report — All Challans','','','Period: '+period]);
  mr.push([]);
  mr.push(['','','','Rate:',...rpt.cols.map(c=>c.rate||'')]);
  mr.push(['SL','Date','Challan No','Customer',...rpt.cols.map(c=>c.col),'Total Value']);
  const mrQ={};let mrV=0;
  rpt.rows.forEach((row,i)=>{
    mr.push([i+1,row.date,row.challan,row.party,...rpt.cols.map(c=>row.qty[c.pid]?Math.round(row.qty[c.pid]*100)/100:''),Math.round(row.value*100)/100]);
    rpt.cols.forEach(c=>{mrQ[c.pid]=(mrQ[c.pid]||0)+(row.qty[c.pid]||0);});
    mrV+=row.value;
  });
  mr.push(['','','','Total',...rpt.cols.map(c=>Math.round((mrQ[c.pid]||0)*100)/100),Math.round(mrV*100)/100]);
  const mrMulti=rpt.cols.filter(c=>c.multi);
  if(mrMulti.length)mr.push(['✱ Multiple rates in range: '+mrMulti.map(c=>c.col+' ('+c.allRates.join('/')+')').join(', ')+' — latest shown']);
  const wsMr=XLSX.utils.aoa_to_sheet(mr);
  wsMr['!cols']=[{wch:4},{wch:11},{wch:12},{wch:22},...rpt.cols.map(()=>({wch:7})),{wch:13}];
  XLSX.utils.book_append_sheet(wb,wsMr,'MIS Report');

  // ── Sheet 2: Invoice Summary — every challan of every customer in range
  //    (respects active supplier/zone/area/party filters) ──
  const iv=[];
  iv.push(['Depo Name: '+depoName,'','','','Depo Code: '+depoCode]);
  iv.push(['All Customers — Invoice Summary','','','','Period: '+period]);
  iv.push([]);
  iv.push(['SL','Date','Challan No','Customer Code','Customer Name','Zone','Area','Total Value']);
  let iv_t=0;
  rpt.rows.forEach((row,i)=>{
    iv.push([i+1,row.date,row.challan,row.code||'',row.party,row.zone||'',row.area||'',Math.round(row.value*100)/100]);
    iv_t+=row.value;
  });
  iv.push(['','','','','','','Total',Math.round(iv_t*100)/100]);
  const wsIv=XLSX.utils.aoa_to_sheet(iv);
  wsIv['!cols']=[{wch:4},{wch:11},{wch:12},{wch:13},{wch:26},{wch:12},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,wsIv,'Invoice Summary');

  // ── Sheet 3: Product Total — all customers, all products in range ──
  const pt=[];
  pt.push(['Depo Name: '+depoName,'','','Depo Code: '+depoCode]);
  pt.push(['All Customers — Product Total','','','Period: '+period]);
  pt.push([]);
  pt.push(['SL','Code','Product Name','Rate','Total Ctn','Total Value']);
  let pv=0,pc=0;
  rpt.cols.forEach((c,i)=>{
    const t=rpt.prodTot[c.pid]||{ctn:0,amt:0};
    pt.push([i+1,c.col,c.name,(c.rate||'')+(c.multi?'✱':''),Math.round(t.ctn*100)/100,Math.round(t.amt*100)/100]);
    pv+=t.amt;pc+=t.ctn;
  });
  pt.push(['','','Total','',Math.round(pc*100)/100,Math.round(pv*100)/100]);
  const multiAll=rpt.cols.filter(c=>c.multi);
  if(multiAll.length)pt.push(['✱ Multiple rates in range: '+multiAll.map(c=>c.col+' ('+c.allRates.join('/')+')').join(', ')+' — latest shown']);
  const ws1=XLSX.utils.aoa_to_sheet(pt);
  ws1['!cols']=[{wch:4},{wch:9},{wch:32},{wch:11},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws1,'Product Total');

  // ── One sheet per customer — ALL products (zero-sales included), same
  //    full column set as every other export sheet, already in Olympic
  //    misCode order ──
  groups.forEach(g=>{
    const colsUsed=rpt.cols;   // all products, zero-quantity included — matches every other export sheet
    const aoa=[];
    aoa.push(['Customer Name: '+g.party,'','','Depo Name: '+depoName]);
    aoa.push(['Customer Code: '+(g.code||'—'),'','','Depo Code: '+depoCode]);
    aoa.push(['Zone: '+(g.zone||'—')+'  Area: '+(g.area||'—'),'','','Period: '+period]);
    aoa.push(['','','Rate:',...colsUsed.map(c=>c.rate||'')]);
    aoa.push(['SL','Date','Challan No',...colsUsed.map(c=>c.col),'Total Value']);
    g.rows.forEach((row,i)=>{
      aoa.push([i+1,row.date,row.challan,...colsUsed.map(c=>row.qty[c.pid]?Math.round(row.qty[c.pid]*100)/100:''),Math.round(row.value*100)/100]);
    });
    const tq={};let tv=0;
    g.rows.forEach(row=>{colsUsed.forEach(c=>{tq[c.pid]=(tq[c.pid]||0)+(row.qty[c.pid]||0);});tv+=row.value;});
    aoa.push(['','','Total',...colsUsed.map(c=>Math.round((tq[c.pid]||0)*100)/100),Math.round(tv*100)/100]);
    const multi=colsUsed.filter(c=>c.multi);
    if(multi.length)aoa.push(['✱ Multiple rates: '+multi.map(c=>c.col+' ('+c.allRates.join('/')+')').join(', ')+' — latest shown']);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:4},{wch:11},{wch:12},...colsUsed.map(()=>({wch:7})),{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,sheetNameSafe(g.party,used));
  });

  const tag=(rpt.from||'').slice(0,7)||'range';
  XLSX.writeFile(wb,`MIS_Report_${tag}.xlsx`);
}

function fillFilters(){
  const parties=P_ALL();
  const custs=parties.filter(p=>p.type==='customer'||p.type==='both');
  const sups=parties.filter(p=>p.type==='supplier'||p.type==='both');
  const sel=(id,list,label)=>{
    const el=document.getElementById(id);const cur=el.value;
    el.innerHTML='<option value="">'+label+'</option>'+list.join('');
    el.value=cur;
  };
  sel('m-party',custs.map(p=>`<option value="${p.id}">${p.name}${p.area?' — '+p.area:''}</option>`),'সব গ্রাহক');
  sel('m-sup',sups.map(p=>`<option value="${p.id}">${p.name}</option>`),'সব সরবরাহকারী');
  sel('m-area',[...new Set(parties.map(p=>(p.area||'').trim()).filter(Boolean))].sort().map(a=>`<option value="${a}">${a}</option>`),'সব এলাকা');
  sel('m-zone',[...new Set(parties.map(p=>(p.zone||'').trim()).filter(Boolean))].sort().map(z=>`<option value="${z}">${z}</option>`),'সব জোন');
  makeSearchable(document.getElementById('m-party'),'🔍 গ্রাহক খুঁজুন…');
  makeSearchable(document.getElementById('m-sup'),'🔍 সরবরাহকারী…');
  bfpSync(document.getElementById('m-party'));bfpSync(document.getElementById('m-sup'));
}

document.getElementById('btn-apply').addEventListener('click',renderMis);
document.getElementById('btn-xlsx').addEventListener('click',downloadXlsx);
// month wins → picking dates clears month; picking month clears dates (mutual)
document.getElementById('m-month').addEventListener('change',()=>{document.getElementById('m-from').value='';document.getElementById('m-to').value='';renderMis();});
['m-from','m-to'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{document.getElementById('m-month').value='';renderMis();}));
['m-party','m-sup','m-area','m-zone'].forEach(id=>document.getElementById(id).addEventListener('change',renderMis));

// init: current month
(function(){
  const now=new Date();
  document.getElementById('m-month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  fillFilters();
  renderMis();
})();
</script>
